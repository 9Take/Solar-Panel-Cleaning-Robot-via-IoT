# Test without the real PLC: adds the mock PLC and points the gateway at it.
#   docker compose -f docker-compose.yml -f docker-compose.sim.yml up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.sim.yml down
# .env stays as for real use (PLC_HOST = the real PLC); the values below override it.
# Sim history goes to logs/sim/gateway.db so it never mixes with the real history.
services:
  gateway:
    environment:
      PLC_HOST: plc-sim
      PLC_PORT: "502"
      HISTORY_DB: logs/sim/gateway.db
    depends_on:
      - plc-sim

  dashboard:
    environment:
      HISTORY_DB: logs/sim/gateway.db

  # Mock Modbus TCP server + simulated robot (python -m app.sim).
  plc-sim:
    build:
      context: .
      target: gateway
    image: solarbot-gateway:latest
    command: ["python", "-m", "app.sim"]
    env_file: .env
    environment:          # fixed inside the container, overrides .env
      SIM_HOST: "0.0.0.0"
      SIM_PORT: "502"
    ports:
      - "5020:502"   # reach the mock from the host (e.g. Modbus Poll) at localhost:5020
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped
