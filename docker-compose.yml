services:
  gateway:
    build:
      context: .
      target: gateway
    image: solarbot-gateway:latest
    env_file: .env
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
    restart: unless-stopped
    # Default bridge network can reach the PLC on the LAN (outbound Modbus TCP).

  # Mock Modbus TCP server for testing without the real PLC.
  # Start with: docker compose --profile sim up
  # and set PLC_HOST=plc-sim in .env
  plc-sim:
    profiles: ["sim"]
    build:
      context: .
      target: gateway
    image: solarbot-gateway:latest
    command: ["python", "-m", "app.sim"]
    env_file: .env
    environment:          # fixed inside the container, overrides .env
      SIM_HOST: "0.0.0.0"
      SIM_PORT: "502"
    ports:
      - "5020:502"   # reach the mock from the host (e.g. Modbus Poll) at localhost:5020
    volumes:
      - ./config:/app/config:ro

  # Streamlit dashboard: open http://<pi-ip>:8501 from a phone or PC on the LAN.
  # Reads/writes the gateway's SQLite DB only (status, commands queue, schedules).
  dashboard:
    build:
      context: .
      target: dashboard
    image: solarbot-dashboard:latest
    env_file: .env
    ports:
      - "8501:8501"
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs          # read-write: commands + schedules are written here
    depends_on:
      - gateway
    restart: unless-stopped
