# Real use (Raspberry Pi + real PLC): gateway + dashboard.
#   docker compose up -d --build
# PLC address comes from .env (PLC_HOST / PLC_PORT).
# Testing without the PLC: add docker-compose.sim.yml (see that file).
services:
  gateway:
    build:
      context: .
      target: gateway
    image: solarbot-gateway:latest
    env_file: .env
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
    restart: unless-stopped
    # Default bridge network can reach the PLC on the LAN (outbound Modbus TCP).

  # Streamlit dashboard: open http://<pi-ip>:8501 from a phone or PC on the LAN.
  # Reads/writes the gateway's SQLite DB only (status, commands queue, schedules).
  dashboard:
    build:
      context: .
      target: dashboard
    image: solarbot-dashboard:latest
    env_file: .env
    ports:
      - "8501:8501"
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs          # read-write: commands + schedules are written here
    depends_on:
      - gateway
    restart: unless-stopped
