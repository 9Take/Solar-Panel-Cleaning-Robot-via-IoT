# PLC tag map: single source of truth for PLC device addresses.
# Spec: docs/robot-operation.md section 7.
#
# !! ASSUMED !! Every M/D address below is a placeholder chosen for the mock PLC.
# Replace them with the real addresses from the ladder program before connecting
# to the real PLC. X/Y inputs/outputs are confirmed by the owner.
#
# Fields:
#   device: Delta device name (e.g. M100, D10, X0). X/Y numbers are octal.
#   dir:    read | write | rw   (from the Pi's point of view)
#   type:   bool | int16 | uint16 | int32 | uint32 | float32
#   scale:  engineering value = raw * scale (optional, default 1)
#   unit:   engineering unit (optional)
#   desc:   meaning

tags:
  # --- Pi -> PLC: command pulses (ladder clears them after use) ---  ASSUMED
  cmd_start:        {device: M100, dir: write, type: bool, desc: "Start cleaning"}
  cmd_stop:         {device: M101, dir: write, type: bool, desc: "Stop where it is (-> Idle)"}
  cmd_return:       {device: M102, dir: write, type: bool, desc: "Return to nearest home end"}
  cmd_reset_alarm:  {device: M103, dir: write, type: bool, desc: "Reset alarm (E-stop must be released)"}

  # --- Pi -> PLC: values ---  ASSUMED
  cycles_setpoint:  {device: D101, dir: rw,    type: uint16, desc: "Cycles per run in Auto mode"}
  battery_pct:      {device: D110, dir: write, type: uint16, unit: "%", desc: "Battery % from Tuya, written by the Pi"}
  pi_heartbeat:     {device: D111, dir: write, type: uint16, desc: "Incremented by the Pi; ladder watchdog"}

  # --- PLC -> Pi: status ---  ASSUMED
  robot_state:      {device: D10, dir: read, type: uint16, desc: "0 Idle, 1 Cleaning, 2 Returning, 3 Home, 4 Alarm"}
  alarm_code:       {device: D11, dir: read, type: uint16, desc: "0 none, 1 E-stop, 2 battery critical, 3 stuck, 4 both limits, 5 heartbeat lost"}
  cycle_count:      {device: D12, dir: read, type: uint16, desc: "Cycles done in the current run"}
  position_est_pct: {device: D13, dir: read, type: uint16, unit: "%", desc: "Estimated position from travel time (0 = X0 end)"}

  # --- PLC inputs (confirmed) ---
  limit_1:          {device: X0, dir: read, type: bool, desc: "Limit switch, end 1"}
  limit_2:          {device: X1, dir: read, type: bool, desc: "Limit switch, end 2"}
  start_stop_btn:   {device: X2, dir: read, type: bool, desc: "Front Start/Stop push button"}
  mode_switch:      {device: X3, dir: read, type: bool, desc: "Mode selector: OFF = Auto, ON = Manual (assumed polarity)"}
  estop_ok:         {device: X4, dir: read, type: bool, desc: "E-stop NC contact: 1 = normal, 0 = pressed"}

  # --- PLC outputs (confirmed) ---
  drive_run:        {device: Y0, dir: read, type: bool, desc: "Drive motor run (PWM to MD30C)"}
  drive_dir:        {device: Y1, dir: read, type: bool, desc: "Drive direction: 1 = toward end 2 (X1) (assumed polarity)"}

  # --- PZEM-017 via PLC RS485 ---  ASSUMED addresses, scales per PZEM-017 datasheet (to verify)
  pzem_voltage:     {device: D20, dir: read, type: uint16, scale: 0.01, unit: V}
  pzem_current:     {device: D21, dir: read, type: uint16, scale: 0.01, unit: A}
  pzem_power:       {device: D22, dir: read, type: uint32, scale: 0.1,  unit: W}
  pzem_energy:      {device: D24, dir: read, type: uint32, unit: Wh}
